<html lang="uk">
<head>
<meta charset="UTF-8">

<title>Фактчекер — фейк чи правда? · ІТ-Майстерня</title>
<meta name="description" content="Тренажер медіаграмотності для 5–12 класу: розслідуй повідомлення, сайти й фото у вигаданому комп'ютері та визнач, фейк це чи правда.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='%23bddcf3'/%3E%3Crect x='14' y='13' width='28' height='36' rx='5' fill='%23fbfbfa'/%3E%3Cpath d='M19 22h18M19 29h14M19 36h10' stroke='%233b3450' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='38' r='9' fill='none' stroke='%23eba497' stroke-width='5'/%3E%3Cpath d='M46.5 44.5l7 7' stroke='%23eba497' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#3b3450;--muted:#6f6787;--card:#fbfbfa;--line:rgba(59,52,80,.12);--shadow:rgba(60,56,72,.18);
 --peach:#f6c6a6;--mint:#bfe3cf;--lilac:#d5c7f1;--sky:#bddcf3;--butter:#f6e19c;--coral:#eba497;--pink:#f5bfd3;
 --bg:#eef3fb;--stamp:#c4493d;--ok:#2f8a5b;--hl:#ffe86b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font:600 16px/1.45 Nunito,system-ui,sans-serif;color:var(--ink);background:#eef3fb;background-image:
 radial-gradient(circle at 8% 10%,#ffe3dc 0,transparent 32%),
 radial-gradient(circle at 92% 12%,#d9ecff 0,transparent 34%),
 radial-gradient(circle at 85% 95%,#e6dcff 0,transparent 32%),
 radial-gradient(circle at 10% 92%,#d8f6e6 0,transparent 30%)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block}
.ink{fill:currentColor}
.stk{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
[hidden]{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 20px;border-radius:16px;border:0;font:700 17px Nunito;background:var(--card);box-shadow:0 4px 0 var(--shadow),0 0 0 1px var(--line);transition:transform .15s}
.btn svg{width:21px;height:21px}
.btn:hover{transform:translateY(-2px) rotate(-.5deg)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow),0 0 0 1px var(--line)}
.btn.main{background:var(--coral)}
.btn.sm{padding:9px 14px;font-size:15px;border-radius:13px}

/* OS */
#os{position:fixed;inset:0;overflow:hidden;z-index:10;user-select:none;background:#dfe8f5;background-image:
 radial-gradient(circle at 15% 20%,#ffe3dc 0,transparent 35%),radial-gradient(circle at 85% 15%,#d9ecff 0,transparent 38%),
 radial-gradient(circle at 75% 90%,#e6dcff 0,transparent 35%),radial-gradient(circle at 20% 85%,#d8f6e6 0,transparent 32%)}
.desk{position:absolute;inset:0 0 58px 0}
.icons{position:absolute;top:14px;left:14px;bottom:14px;display:grid;grid-template-rows:repeat(auto-fill,100px);grid-auto-flow:column;grid-auto-columns:94px;gap:4px 8px;align-content:start}
.dic{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:0;background:none;border-radius:16px;font:800 13px Nunito;text-align:center}
.dic:hover,.dic:focus-visible{background:rgba(255,255,255,.55)}
.dic .ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;box-shadow:0 4px 0 var(--shadow),0 0 0 1px var(--line)}
.dic .ico svg{width:28px;height:28px}
.badge{position:absolute;top:4px;right:14px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--stamp);color:#fff;font:800 12px/20px Nunito;box-shadow:0 0 0 2px #fff}
.c-msg{background:var(--sky)}.c-sms{background:var(--mint)}.c-web{background:var(--butter)}.c-feed{background:var(--pink)}.c-tools{background:var(--lilac)}.c-case{background:var(--peach)}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:58px;display:flex;align-items:center;gap:6px;padding:0 10px;background:color-mix(in srgb,var(--card) 96%,transparent);border-top:1px solid var(--line)}
.tb{display:flex;align-items:center;gap:7px;height:42px;padding:0 12px;border-radius:13px;border:0;background:transparent;font:800 14px Nunito;white-space:nowrap}
.tb.on{background:rgba(59,52,80,.08)}
.tb .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.tb .ico svg{width:17px;height:17px}
.tbapps{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
.clock{font:700 14px ui-monospace,Consolas,monospace;color:var(--muted);padding:0 6px}
.casebtn{background:var(--peach)!important;box-shadow:0 3px 0 var(--shadow),0 0 0 1px var(--line)}

/* windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--card);border-radius:18px;box-shadow:0 6px 0 var(--shadow),0 0 0 1px var(--line),0 24px 50px -24px rgba(40,30,70,.45);overflow:hidden;min-width:300px}
.wt{display:flex;align-items:center;gap:9px;height:44px;padding:0 6px 0 12px;border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none;flex:none}
.wt .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.wt .ico svg{width:16px;height:16px}
.wt b{font:800 15px Rubik,sans-serif;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtn{width:34px;height:34px;border-radius:10px;border:0;background:none;display:grid;place-items:center;flex:none}
.wbtn:hover{background:rgba(59,52,80,.08)}
.wclose:hover{background:rgba(196,73,61,.14)}
.wbtn svg{width:17px;height:17px}
.rsz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,rgba(59,52,80,.25) 50%,rgba(59,52,80,.25) 58%,transparent 58%,transparent 70%,rgba(59,52,80,.25) 70%,rgba(59,52,80,.25) 78%,transparent 78%)}
.win.maxed{border-radius:0}.win.maxed .rsz{display:none}
.tb.mini{opacity:.6}
.wb{flex:1;overflow:auto;position:relative}
@media (max-width:760px){
 .icons{grid-template-columns:repeat(3,1fr);grid-template-rows:none;grid-auto-flow:row;grid-auto-columns:auto;left:10px;right:10px;top:12px;bottom:auto}
 .win{left:0!important;top:0!important;width:100%!important;height:calc(100% - 58px)!important;border-radius:0;min-width:0}
 .wt{cursor:default}
 .wmax,.rsz{display:none}
 .tb .lbl{display:none}
 .tb.casebtn .lbl{display:inline}
}


.c-pc{background:var(--sky)}.c-bin{background:#e4e1ea}.c-guide{background:var(--coral)}.c-notes{background:var(--butter)}.c-photos{background:var(--pink)}.c-set{background:var(--lilac)}.c-butter{background:var(--butter)}
.startb{width:46px;height:46px;flex:none;border:0;border-radius:14px;background:rgba(59,52,80,.06);display:grid;place-items:center}
.startb.on,.startb:hover{background:var(--sky)}
.tray{display:flex;align-items:center;gap:2px;flex:none}
.trb{position:relative;width:40px;height:40px;border:0;border-radius:12px;background:none;display:grid;place-items:center}
.trb svg{width:21px;height:21px}
.trb:hover{background:rgba(59,52,80,.06)}
.trb.on{background:var(--hl)}
.trb .badge{top:1px;right:1px}
.mkb{display:flex;gap:6px;width:auto;padding:0 12px;font:800 14px Nunito;box-shadow:0 0 0 1px var(--line)}
.tb.casebtn.on{outline:2px solid var(--ink)}
.startm,.ncenter{position:absolute;bottom:68px;width:380px;max-width:calc(100% - 20px);background:var(--card);border-radius:20px;box-shadow:0 6px 0 var(--shadow),0 0 0 1px var(--line),0 30px 60px -24px rgba(40,30,70,.5);padding:16px;z-index:1500}
.startm{left:10px}.ncenter{right:10px;max-height:70%;overflow:auto}
.sm-user{display:flex;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.sm-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:0;background:none;border-radius:14px;font:800 12.5px Nunito;text-align:center}
.sm-grid button:hover{background:rgba(59,52,80,.06)}
.sm-grid .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;box-shadow:0 3px 0 var(--shadow)}
.sm-grid .ico svg{width:22px;height:22px}
.sm-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.notifs{position:absolute;right:12px;bottom:70px;width:340px;max-width:calc(100% - 24px);display:flex;flex-direction:column;gap:8px;z-index:1400;pointer-events:none}
.notif{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--card);box-shadow:0 5px 0 var(--shadow),0 0 0 1px var(--line),0 18px 40px -20px rgba(40,30,70,.5);cursor:pointer;transform:translateX(40px);opacity:0;transition:transform .3s,opacity .3s}
.notif.on{transform:none;opacity:1}
.notif .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.notif .ico svg{width:20px;height:20px}
.notif b{display:block;font:800 14.5px Rubik,sans-serif}
.notif small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;color:var(--muted)}
.nx{margin-left:auto;border:0;background:none;width:26px;height:26px;display:grid;place-items:center;flex:none;border-radius:8px}
.nx svg{width:15px;height:15px}
.boot,.off{position:fixed;inset:0;z-index:3000;background:#2e2940;color:#fff;display:grid;place-items:center;text-align:center;transition:opacity .4s}
.boot.hide{opacity:0}
.boot img{margin:0 auto 22px;border-radius:22px}
.bl{width:160px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;margin:0 auto}
.bl i{display:block;height:100%;width:40%;border-radius:3px;background:var(--sky);animation:bl 1s ease-in-out infinite}
@keyframes bl{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.powerbig{width:86px;height:86px;border-radius:50%;border:0;background:var(--coral);display:grid;place-items:center;margin:0 auto;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.powerbig svg{width:40px;height:40px;color:#3b3450}
@media (prefers-reduced-motion:reduce){.bl i{animation:none;width:100%}.notif{transition:none}}
.fx{display:grid;grid-template-columns:170px 1fr;height:100%}
.fxs{border-right:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto;background:rgba(59,52,80,.03)}
.fxs button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:8px 10px;border-radius:10px;font:700 14px Nunito;text-align:left;white-space:nowrap}
.fxs button svg{width:18px;height:18px;flex:none}
.fxs button.on{background:rgba(189,220,243,.6)}
.fxm{display:flex;flex-direction:column;min-height:0}
.fxp{display:flex;gap:8px;align-items:center;padding:8px 14px;min-height:48px;border-bottom:1px solid var(--line);font:800 14.5px Nunito}
.fxp svg{width:18px;height:18px}
.fxg{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;overflow:auto;align-content:start}
.fi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:0;background:none;border-radius:12px;font:700 13px Nunito;text-align:center;word-break:break-word}
.fi:hover{background:rgba(59,52,80,.06)}
.fi .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;box-shadow:0 3px 0 var(--shadow)}
.fi .ico svg{width:24px;height:24px}
.guide{display:grid;grid-template-columns:200px 1fr;height:100%}
.gs{border-right:1px solid var(--line);padding:8px;overflow:auto;background:rgba(235,164,151,.08)}
.gs button{display:flex;gap:8px;align-items:baseline;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;font:700 14px Nunito;text-align:left}
.gs button b{font:800 13px Rubik;color:var(--muted)}
.gs button.on{background:rgba(235,164,151,.35)}
.gc{overflow:auto;padding:20px 24px;font-size:15.5px}
.gc h2{font:800 22px Rubik,sans-serif;margin-bottom:10px}
.gc ul,.gc ol{padding-left:22px;margin:8px 0}.gc li{margin:6px 0}
.gc .ex{padding:9px 12px;border-radius:12px;background:rgba(59,52,80,.05);margin:8px 0;font:600 14px ui-monospace,Consolas,monospace;word-break:break-all}
.gnav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.gframe{width:100%;height:100%;border:0;display:block;background:#fff}
.win.dragging .gframe{pointer-events:none}
.note-body{padding:18px;white-space:pre-wrap;font:600 15px/1.55 ui-monospace,Consolas,monospace;user-select:text}
.setp{padding:18px;display:flex;flex-direction:column;gap:8px}
.setp h3{font:800 16px Rubik;margin-top:10px}
.fwd.who{font-style:normal;font-weight:800;color:#7a5aa6}
.daysep{align-self:center;font:800 12px Nunito;color:var(--muted);background:rgba(255,255,255,.7);padding:3px 10px;border-radius:10px;margin:4px 0}
@media (max-width:760px){
 .fx,.guide{grid-template-columns:1fr;grid-template-rows:auto 1fr}
 .fxs,.gs{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);display:flex}
 .gs button{width:auto;white-space:nowrap}
 .tray .lbl,.mkb .lbl{display:none}
 .mkb{padding:0 10px}
 .notifs{left:12px;right:12px;width:auto;top:12px;bottom:auto}
 .tbapps .tb{padding:0 6px}
 .notif:nth-child(n+3){display:none}
 .taskbar{gap:4px;padding:0 6px}
 .tb.casebtn{padding:0 8px}
 .trb{width:36px}
}
@media (max-width:420px){.clock{display:none}}


.ctx{position:fixed;z-index:2500;min-width:220px;padding:6px;border-radius:14px;background:var(--card);box-shadow:0 5px 0 var(--shadow),0 0 0 1px var(--line),0 20px 40px -18px rgba(40,30,70,.5)}
.ctx button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;font:700 14.5px Nunito;text-align:left}
.ctx button:hover{background:rgba(189,220,243,.6)}
.ctx svg{width:17px;height:17px;flex:none}
.ctx hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.spam{position:fixed;inset:0;z-index:2200;overflow:hidden}
.ad{position:absolute;width:300px;max-width:calc(100% - 20px);border-radius:14px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 3px #3b3450;overflow:hidden;animation:adin .18s ease-out}
@keyframes adin{from{transform:scale(.6);opacity:0}}
.adt{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;background:#3b3450;color:#fff;font:800 12px Nunito}
.adt button{width:26px;height:26px;border:0;border-radius:7px;background:#c4493d;color:#fff;display:grid;place-items:center}
.adt svg{width:14px;height:14px}
.adb{padding:14px;background:var(--ad);text-align:center}
.adb h4{font:800 22px Rubik;color:#c4493d;margin-bottom:6px}
.adb p{font:700 14.5px Nunito;margin-bottom:10px}
.adbtn{display:inline-block;padding:9px 18px;border-radius:12px;background:#38d27a;font:800 15px Rubik;color:#10331f}
#os.sick .desk{filter:hue-rotate(-30deg) saturate(1.6)}
.crash{position:fixed;inset:0;z-index:2600;display:grid;place-items:center;background:rgba(40,10,15,.55)}
.crashb{width:min(440px,calc(100% - 28px));padding:24px;border-radius:22px;background:var(--card);text-align:center;box-shadow:0 6px 0 var(--shadow),0 30px 60px -20px rgba(0,0,0,.5)}
.crashb h3{font:800 24px Rubik;margin-bottom:8px;color:#c4493d}
@media (prefers-reduced-motion:reduce){.ad{animation:none}}

/* marker */
.mk{border-radius:5px;transition:background .15s, box-shadow .15s}
body.marker #os .mk{cursor:crosshair}
body.marker #os .mk:hover{background:rgba(255,232,107,.45);box-shadow:0 0 0 2px rgba(255,232,107,.45)}
.mk.found{background:var(--hl)!important;box-shadow:0 0 0 2px var(--hl)!important}
body.marker #os{cursor:crosshair}
.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}

/* case panel */
.casep{padding:16px;display:flex;flex-direction:column;gap:14px}
.casep .num{font:800 13px Nunito;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.casep h3{font:800 20px/1.2 Rubik,sans-serif}
.casep .brief{font-size:15.5px}
.evs{display:flex;flex-direction:column;gap:6px}
.evh{display:flex;justify-content:space-between;font:800 14px Nunito}
.ev{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:11px;background:rgba(59,52,80,.05);font-size:14.5px;line-height:1.3}
.ev.got{background:#fff6bf}
.ev svg{width:18px;height:18px;flex:none;margin-top:1px}
.ev.empty{color:var(--muted)}
.stamps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.st{border:2.5px solid currentColor;border-radius:12px;background:var(--card);padding:10px 4px;font:800 13.5px Rubik,sans-serif;text-transform:uppercase;letter-spacing:.3px;transform:rotate(-2deg)}
.st.fake{color:var(--stamp)}.st.true{color:var(--ok)}.st.manip{color:#a26a12}
.st:hover{transform:rotate(-4deg) scale(1.04)}
.stbox{position:sticky;bottom:0;background:var(--card);padding:10px 0 4px;margin-top:-4px;box-shadow:0 -12px 12px -8px var(--card)}
.hintb{align-self:flex-start;background:none;border:0;font:800 14px Nunito;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.hintt{font-size:14.5px;padding:10px 12px;border-radius:12px;background:var(--lilac)}
.scorepill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:12px;background:var(--mint);font:800 13px Nunito}

/* messenger / sms */
.chat{display:grid;grid-template-columns:200px 1fr;height:100%}
.chats{border-right:1px solid var(--line);overflow:auto}
.ch{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.ch.on{background:rgba(189,220,243,.45)}
.ch small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 15px Rubik,sans-serif;flex:none}
.conv{display:flex;flex-direction:column;min-height:0}
.convh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font:800 15px Rubik}
.convh .back{display:none;border:0;background:none;width:30px;height:30px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:rgba(189,220,243,.18)}
.bub{max-width:82%;padding:9px 12px;border-radius:16px 16px 16px 5px;background:var(--card);box-shadow:0 2px 0 var(--shadow);font-size:15px}
.bub.me{align-self:flex-end;border-radius:16px 16px 5px 16px;background:#d9ecff}
.bub time{display:block;font-size:11.5px;color:var(--muted);text-align:right;margin-top:3px}
.fwd{font-size:12.5px;color:var(--muted);font-style:italic;margin-bottom:4px}
.lnk{color:#2763b0;text-decoration:underline;word-break:break-all;cursor:pointer}
.replies{display:flex;flex-direction:column;gap:6px;padding:10px;border-top:1px solid var(--line);flex:none;max-height:45%;overflow:auto}
.rph{font:800 12.5px Nunito;color:var(--muted)}
.rep{text-align:left;border:0;border-radius:14px 14px 5px 14px;padding:9px 13px;background:#d9ecff;font:700 14.5px Nunito;box-shadow:0 2px 0 var(--shadow)}
.rep:hover{background:var(--sky)}
.inp input{flex:1;border:0;border-radius:12px;padding:9px 12px;background:rgba(59,52,80,.06)}
.empty-app{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:760px){.chat{grid-template-columns:1fr}.chat.open .chats{display:none}.chat:not(.open) .conv{display:none}.convh .back{display:grid;place-items:center}}

/* browser */
.br{display:flex;flex-direction:column;height:100%}
.brbar{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line);flex:none}
.brbar button{width:34px;height:34px;border:0;border-radius:10px;background:none;display:grid;place-items:center}
.brbar button svg{width:18px;height:18px}
.url{flex:1;display:flex;align-items:center;gap:6px;min-width:0;background:rgba(59,52,80,.06);border-radius:12px;padding:0 10px}
.url input{border:0;background:none;padding:8px 0;flex:1;min-width:0;font:600 14px ui-monospace,Consolas,monospace;outline:none}
.bms{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.bm{border:0;background:rgba(59,52,80,.05);border-radius:9px;padding:4px 10px;font:700 13px Nunito;white-space:nowrap}
.page{flex:1;overflow:auto;background:#fff}
.pg{padding:22px;max-width:720px;margin:0 auto}
.pg h1{font:800 26px/1.2 Rubik,sans-serif;margin-bottom:10px}
.pg h2{font:800 20px Rubik,sans-serif;margin:14px 0 6px}
.pg p{margin:8px 0}
.pg .meta{color:var(--muted);font-size:14px}
.pg .fld{display:block;margin:10px 0}
.pg .fld span{display:block;font:800 14px Nunito;margin-bottom:4px}
.pg .fld input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid #ccd;background:#fff}
.pg .go{display:inline-block;margin-top:10px;padding:12px 22px;border-radius:12px;border:0;font:800 16px Rubik}
.notfound{padding:50px 20px;text-align:center;color:var(--muted)}
.notfound h2{font:800 22px Rubik;color:var(--ink);margin-bottom:6px}
.sr{padding:12px 0;border-bottom:1px solid #eee}
.sr .u{font:600 13px ui-monospace,Consolas,monospace;color:#2f7a4f}
.sr a{display:block;font:800 17px Rubik;color:#2763b0;cursor:pointer;margin:2px 0}
.sbox{display:flex;gap:8px;margin:10px 0 16px}
.sbox input{flex:1;padding:12px 16px;border-radius:24px;border:1.5px solid #ccd;font-size:16px}
.sbox button{border:0;border-radius:24px;padding:0 18px;background:var(--sky);font:800 15px Rubik}
.slogo{font:800 40px Rubik;text-align:center;margin:30px 0 6px;letter-spacing:-1px}
.slogo span:nth-child(1){color:#3d7dd8}.slogo span:nth-child(2){color:#d85a4a}.slogo span:nth-child(3){color:#e2a92b}.slogo span:nth-child(4){color:#3d7dd8}.slogo span:nth-child(5){color:#2f9a62}.slogo span:nth-child(6){color:#d85a4a}

/* feed */
.feed{max-width:520px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.post{background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line),0 3px 0 var(--shadow);overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ph b{font:800 15px Rubik}
.ph small{color:var(--muted);font-size:12.5px;display:block}
.vf{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-left:3px}
.pimg{position:relative;background:#eef}
.pimg svg{width:100%;height:auto}
.chkph{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;align-items:center;border:0;border-radius:12px;padding:7px 11px;background:rgba(251,251,250,.95);font:800 13px Nunito;box-shadow:0 2px 0 var(--shadow)}
.chkph svg{width:16px;height:16px}
.pt{padding:10px 12px 12px;font-size:15px}
.pt .small{font-size:11.5px;color:var(--muted);margin-top:6px}
.likes{display:flex;gap:14px;padding:0 12px 10px;color:var(--muted);font:700 13px Nunito}

/* tools */
.tabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{border:0;border-radius:11px;padding:8px 12px;font:800 14px Nunito;background:rgba(59,52,80,.05);display:flex;gap:6px;align-items:center}
.tab svg{width:17px;height:17px}
.tab.on{background:var(--lilac)}
.tpane{padding:16px}
.tpane .row{display:flex;gap:8px}
.tpane input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);font:600 14px ui-monospace,Consolas,monospace;background:#fff}
.res{margin-top:14px;padding:14px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line);font-size:15px}
.res dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.res dt{color:var(--muted);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:92px;border:0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 0 var(--shadow);padding:0}
.thumb.on{box-shadow:0 0 0 3px var(--coral)}
.thumb svg{width:100%;height:auto}
.tl{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.tl div{display:flex;gap:10px;align-items:baseline}
.tl b{font:800 14px ui-monospace,Consolas,monospace;min-width:84px}
.note{font-size:14px;color:var(--muted)}

/* dialogs */
dialog{border:0;border-radius:22px;padding:0;max-width:520px;width:calc(100% - 28px);max-height:calc(100% - 40px);margin:auto;background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--shadow),0 30px 60px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(30,25,45,.45)}
.dlg{padding:22px;position:relative}
.dlg h2{font:800 24px Rubik,sans-serif;margin-bottom:8px;padding-right:40px}
.dlg h3{font:800 16px Rubik,sans-serif;margin:18px 0 8px}
.close{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:12px;border:0;background:rgba(59,52,80,.06);font:700 24px/1 Nunito}
.seg{display:flex;gap:6px;background:rgba(59,52,80,.06);padding:4px;border-radius:14px}
.seg button{flex:1;border:0;border-radius:11px;padding:9px;background:none;font:800 14px Nunito;display:flex;gap:6px;align-items:center;justify-content:center}
.seg button svg{width:18px;height:18px}
.seg button.on{background:var(--card);box-shadow:0 2px 0 var(--shadow),0 0 0 1px var(--line)}
.steps{display:flex;flex-direction:column;gap:9px}
.steps div{display:flex;gap:11px;align-items:center;font-size:15px}
.steps .si{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.steps .si svg{width:20px;height:20px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:15px;align-items:center}
kbd{font:800 13px ui-monospace,Consolas,monospace;padding:3px 8px;border-radius:8px;background:#fff;box-shadow:0 2px 0 var(--shadow),0 0 0 1px var(--line);white-space:nowrap}
.gh{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font:800 15px Nunito;color:var(--ink);text-decoration:none;padding:10px 14px;border-radius:13px;background:rgba(59,52,80,.06)}
.gh svg{width:19px;height:19px;color:#d9a21b}
.dfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.verdict{display:flex;align-items:center;gap:16px;margin:6px 0 12px}
.bigstamp{font:800 22px Rubik;text-transform:uppercase;border:4px solid currentColor;border-radius:14px;padding:8px 14px;transform:rotate(-8deg);white-space:nowrap}
.rl{display:flex;flex-direction:column;gap:8px}
.ri{display:flex;gap:10px;font-size:14.5px;line-height:1.35}
.ri svg{width:20px;height:20px;flex:none;margin-top:1px}
.ri.y svg{color:var(--ok)}.ri.n svg{color:var(--stamp)}
.ri b{display:block}
.pts{font:800 15px Rubik;margin-top:12px}
.stars{display:flex;gap:6px;justify-content:center;margin:8px 0}
.stars svg{width:44px;height:44px}
.rank{text-align:center;font:800 22px Rubik;margin-bottom:4px}
.sumt{width:100%;border-collapse:collapse;margin-top:10px;font-size:14.5px}
.sumt td{padding:7px 4px;border-bottom:1px solid var(--line)}
.sumt td:last-child{text-align:right;font-weight:800}

.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font:700 15px Nunito;z-index:2000;transition:.25s;pointer-events:none;max-width:calc(100% - 30px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}


/* site skins */
.sk-scam{background:linear-gradient(160deg,#2b1d5c,#7a2a8f);color:#fff;min-height:100%}
.sk-scam .pg h1{font-size:30px;text-align:center}
.timer{font:800 34px ui-monospace,Consolas,monospace;text-align:center;color:#ffd84a;margin:8px 0}
.sk-scam .go{background:#38d27a;color:#10331f}
.sk-scam .fld input{border-color:#a98ad6}
.sk-sp{background:#fff}
.sp-top{background:#7a5a3a;color:#fff;padding:12px 22px;font:800 20px Rubik;display:flex;align-items:center;gap:10px}
.sp-top.bad{background:#9a6c43}
.sk-lp .lp-top{background:#c43c2f;color:#fff;padding:12px 22px;font:800 26px Rubik;letter-spacing:.5px}
.sk-lp .lp-nav{background:#2d2d2d;color:#ddd;padding:6px 22px;font:700 13px Nunito}
.share{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:10px;background:#c43c2f;color:#fff;font:800 15px Rubik}
.gov-top{background:#2c5a8c;color:#fff;padding:12px 22px;font:800 18px Rubik}
.pb-top{background:#3b3450;color:#fff;padding:12px 22px;font:800 20px Rubik;display:flex;gap:10px;align-items:center}
.pb-top i{display:inline-grid;grid-template-columns:repeat(2,8px);gap:2px}
.pb-top i b{width:8px;height:8px;background:#9fe3c0;border-radius:2px}
.pb-top i b:nth-child(2){background:#f6c6a6}.pb-top i b:nth-child(3){background:#bddcf3}
.cardform{background:#f6f7fb;border-radius:14px;padding:14px;margin-top:12px}
</style>
</head>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('fc-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fc-' + k, JSON.stringify(v)); } catch (e) {} }
};
let rnd = Math.random;
const pick = a => a[Math.floor(rnd() * a.length)];
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const icon = (id, cls = '') => `<svg viewBox="0 0 24 24" class="${cls}"><use href="#${id}"/></svg>`;
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }

/* ---------- sound ---------- */
let sound = store.get('sound', true), actx;
function tone(f, d = .12, type = 'sine', v = .07, delay = 0) {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const sfx = {
  click: () => tone(520, .05, 'triangle', .04),
  mark: () => { tone(660, .08, 'triangle'); tone(990, .1, 'triangle', .06, .07); },
  bad: () => tone(180, .18, 'square', .04),
  ding: () => { tone(880, .12); tone(1320, .18, 'sine', .05, .1); },
  stamp: () => { tone(90, .25, 'triangle', .14); tone(60, .3, 'sine', .12, .02); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .18, 'triangle', .06, i * .1))
};

/* ---------- world registries ---------- */
let PAGES, DOSSIER, PHOTOS, SEARCH, CHATS, SMS, FEED;
function resetWorld() {
  PAGES = {}; DOSSIER = {}; PHOTOS = {}; SEARCH = []; CHATS = {}; SMS = []; FEED = [];
  /* постійні сайти світу */
  PAGES['poshuk.web'] = () => searchPage('');
  PAGES['stara-poshta.ua'] = () => `<div class="sk-sp"><div class="sp-top">${spLogo()}Стара пошта</div><div class="pg">
    <h1>Відстежити посилку</h1><p>Усі твої відправлення — в особистому кабінеті.</p>
    <div class="cardform"><b>Мої посилки</b><p class="mk" data-ev="noparcel">Активних посилок немає. Ти нічого не очікуєш.</p></div>
    <p class="meta">Стара пошта ніколи не просить оплатити доставку за посиланням із SMS.</p></div></div>`;
  PAGES['pixelbank.ua'] = () => `<div class="pb-top"><i><b></b><b></b><b></b><b></b></i>ПіксельБанк</div><div class="pg">
    <h1>ПіксельБанк</h1><p>Картки, перекази, накопичення.</p><p><span class="lnk" data-go="pixelbank.ua/500">Акція «500 грн для школярів» →</span></p></div>`;
  DOSSIER['stara-poshta.ua'] = {created: '2009 рік', owner: 'ТОВ «Стара пошта»', note: 'Офіційний сайт служби доставки.'};
  DOSSIER['pixelbank.ua'] = {created: '2012 рік', owner: 'АТ «ПіксельБанк»', note: 'Офіційний сайт банку.'};
  DOSSIER['lypove.gov.ua'] = {created: '2014 рік', owner: 'Липівська міська рада', note: 'Офіційний сайт міської ради.'};
}
const spLogo = () => `<svg viewBox="0 0 24 24" width="26" height="26"><rect x="3" y="6" width="18" height="13" rx="2" fill="#f6e19c"/><path d="M3 9l9 5 9-5" fill="none" stroke="#7a5a3a" stroke-width="2"/></svg>`;
function host(u) { return String(u).replace(/^https?:\/\//, '').replace(/^www\./, '').split(/[/?#]/)[0].toLowerCase(); }
function normUrl(u) { return String(u).trim().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/$/, '').toLowerCase(); }

/* ---------- SVG photos ---------- */
const PH = {
  shark: (s = 1) => `<svg viewBox="0 0 400 260" aria-label="Фото: акула на затопленій вулиці"><rect width="400" height="260" fill="#9fb4c8"/><rect x="0" y="40" width="90" height="130" fill="#c8b9a6"/><rect x="18" y="62" width="20" height="26" fill="#6b7c8f"/><rect x="52" y="62" width="20" height="26" fill="#6b7c8f"/><rect x="100" y="20" width="120" height="150" fill="#d9cbb5"/><rect x="118" y="44" width="24" height="30" fill="#6b7c8f"/><rect x="160" y="44" width="24" height="30" fill="#6b7c8f"/><rect x="118" y="92" width="24" height="30" fill="#6b7c8f"/><rect x="160" y="92" width="24" height="30" fill="#6b7c8f"/><rect x="232" y="56" width="168" height="114" fill="#bfae98"/><rect x="250" y="76" width="22" height="26" fill="#6b7c8f"/><rect x="300" y="76" width="22" height="26" fill="#6b7c8f"/><rect x="350" y="76" width="22" height="26" fill="#6b7c8f"/><rect x="0" y="150" width="400" height="110" fill="#7d8a6c"/><path d="M0 158q40-6 80 0t80 0 80 0 80 0 80 0v102H0z" fill="#6f7d5d" opacity=".7"/><path d="M150 205q60-22 130-6q-30 4-40 16q-40 6-90-10z" fill="#5a6a78"/><path d="M215 197l18-38 10 36z" fill="#4b5a68"/><path d="M276 199l22-14-6 20z" fill="#4b5a68"/><circle cx="170" cy="203" r="2.6" fill="#111"/><path d="M60 230q30-4 60 0M260 238q40-5 80 0" stroke="#9aa88a" stroke-width="3" fill="none"/></svg>`,
  promo: (sum) => `<svg viewBox="0 0 400 260" aria-label="Банер ПіксельБанку"><rect width="400" height="260" fill="#3b3450"/><g fill="#9fe3c0"><rect x="30" y="30" width="22" height="22" rx="4"/><rect x="56" y="56" width="22" height="22" rx="4" fill="#f6c6a6"/><rect x="30" y="56" width="22" height="22" rx="4" fill="#bddcf3"/><rect x="56" y="30" width="22" height="22" rx="4"/></g><text x="200" y="140" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="800" font-size="72" fill="#f6e19c">${sum} ₴</text><text x="200" y="185" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="700" font-size="24" fill="#fff">кожному школяру*</text><rect x="250" y="200" width="120" height="40" rx="10" fill="#bfe3cf"/><text x="310" y="226" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="800" font-size="16" fill="#3b3450">Отримати</text></svg>`,
  coins: () => `<svg viewBox="0 0 300 120" width="260" style="margin:6px auto"><g font-family="Rubik" font-weight="800" font-size="30" text-anchor="middle">${[40, 110, 180, 250].map((x, i) => `<circle cx="${x}" cy="${60 + (i % 2 ? -10 : 10)}" r="32" fill="#ffd84a" stroke="#c99a10" stroke-width="5"/><text x="${x}" y="${71 + (i % 2 ? -10 : 10)}" fill="#a87a00">R</text>`).join('')}</g></svg>`
};

/* ---------- shift (cases) ---------- */
const FRIENDS = ['Максим', 'Дмитро', 'Софія', 'Остап', 'Аня', 'Тимур', 'Злата', 'Назар'];
const SISTERS = ['Оля', 'Катя', 'Даринка', 'Мирослава'];
const AVC = ['var(--sky)', 'var(--mint)', 'var(--peach)', 'var(--lilac)', 'var(--butter)', 'var(--pink)'];
const VERD = {fake: 'Фейк', true: 'Правда', manip: 'Маніпуляція'};

function buildShift() {
  resetWorld();
  const friend = pick(FRIENDS), sister = pick(SISTERS);
  seedHistory(friend, sister);
  const cases = [];

  /* 1. Безкоштовні робакси */
  {
    const dom = pick(['roblox-free-robux.top', 'robux-gift.click', 'free-robux24.xyz']);
    const amount = pick([1000, 5000, 10000]), mins = pick([2, 3, 5]);
    cases.push({
      app: 'msg', chat: friend, title: 'Безкоштовні робакси', verdict: 'fake',
      brief: `${friend} скинув у Месенджер посилання на безкоштовні робакси. Перевір, чи безпечно туди переходити.`,
      hint: 'Подивись уважно на адресу сайту і на те, що він просить ввести. Можна перевірити сайт у «Досьє сайту».',
      ev: {
        domain1: {label: `Дивний домен ${dom}`, why: 'Справжні роздачі Roblox бувають лише на офіційному сайті roblox.com, а не на випадкових доменах .top, .click чи .xyz.'},
        free: {label: 'Обіцянка «безкоштовно для всіх»', why: 'Шахраї приманюють халявою: валюту ігор ніхто не роздає просто так.'},
        timer: {label: 'Таймер, що підганяє', why: 'Відлік часу не дає подумати. Поспіх — улюблений прийом шахраїв.'},
        pass: {label: 'Просять пароль від акаунта', why: 'Жоден справжній подарунок не вимагає твого пароля. З ним акаунт просто вкрадуть.'},
        age1: {label: `Сайт створено ${pick(['3 дні', '5 днів', 'тиждень'])} тому`, why: 'Свіжий сайт без історії — типова ознака шахрайської сторінки.'}
      },
      setup() {
        addChat(friend, [
          {t: `<span class="mk">Йоу!!</span> тут дають <span class="mk" data-ev="free">безкоштовні робакси</span> 😱 я вже забрав ${amount}`, time: '16:41'},
          {t: `<span class="lnk mk" data-ev="domain1" data-go="${dom}">https://${dom}/gift</span>`, time: '16:41'},
          {t: `встигни, там лише ${mins} хв!!`, time: '16:42'}
        ]);
        setReplies(friend, [
          {t: 'Не вводь туди пароль! Це шахраї, вони крадуть акаунти', ans: 'ой 😳 я якраз хотів ввести… дякую, що сказав!'},
          {t: 'Зараз гляну 👀', ans: 'давай швидше, бо згорить!!'},
          {t: 'Перевірю й напишу', ans: 'ок, чекаю'}
        ]);
        PAGES[dom] = PAGES[dom + '/gift'] = () => `<div class="sk-scam"><div class="pg">
          <h1 class="mk" data-ev="free">БЕЗКОШТОВНІ РОБАКСИ ДЛЯ ВСІХ!</h1>
          ${PH.coins()}
          <p style="text-align:center" class="mk">Отримай ${amount} R$ прямо зараз</p>
          <div class="timer mk" data-ev="timer" id="scamTimer">0${mins}:00</div>
          <p style="text-align:center;font-size:14px" class="mk" data-ev="timer">Пропозиція згорить, коли закінчиться час!</p>
          <form data-trap="pass">
            <label class="fld"><span>Нікнейм у Roblox</span><input autocomplete="off"></label>
            <label class="fld"><span class="mk" data-ev="pass">Пароль від акаунта</span><input type="password" autocomplete="off"></label>
            <button class="go" type="submit">Забрати робакси</button>
          </form></div></div>`;
        DOSSIER[dom] = {created: '<span class="mk" data-ev="age1">' + cases[0].ev.age1.label.replace('Сайт створено ', '') + '</span>', owner: '<span class="mk">приховано</span>', note: 'Сайт не має жодного стосунку до компанії Roblox.'};
      }
    });
  }

  /* 2. Посилка затримана */
  {
    const dom = pick(['stara-poshta.delivery-pay.xyz', 'stara-poshta.pay-dostavka.top', 'stara-poshta.parcel-fee.online']);
    const sum = pick([19, 24, 29]);
    const num = '+44 7' + ri(100, 999) + ' ' + ri(100000, 999999);
    cases.push({
      app: 'sms', title: 'Посилка затримана', verdict: 'fake',
      brief: 'Тобі прийшла SMS про посилку, яку «затримали». Ти нічого не замовляв. Що це?',
      hint: 'Справжня адреса сайту — це остання частина перед першою «/». Перевір її в «Досьє сайту» і зайди на офіційний сайт Старої пошти із закладок.',
      ev: {
        sender: {label: `Іноземний номер ${num}`, why: 'Служба доставки пише з назвою відправника, а не з випадкового іноземного номера.'},
        domain2: {label: 'Справжній домен — не stara-poshta.ua', why: `У ${dom} головна частина — ${dom.split('.').slice(1).join('.')}. «stara-poshta» на початку — лише маскування.`},
        pay: {label: `Просять оплатити ${sum} грн за посиланням`, why: 'Стара пошта не просить доплатити за посиланням із SMS. Невелика сума — щоб не насторожився.'},
        card: {label: 'Вимагають дані картки і CVV', why: 'CVV-код не можна вводити на невідомих сайтах: з ним злодії знімуть усі гроші з картки.'},
        noparcel: {label: 'В офіційному кабінеті посилок немає', why: 'Перевірка на справжньому сайті — найнадійніший спосіб: посилки просто не існує.'}
      },
      setup() {
        addSms({from: num, fromMk: 'sender', time: '09:13', t: `Stara Poshta: Vasha posylka zatrymana. <span class="mk" data-ev="pay">Oplatit dostavku ${sum} grn</span> do 18:00: <span class="lnk mk" data-ev="domain2" data-go="${dom}">${dom}</span>`});
        PAGES[dom] = () => `<div class="sk-sp"><div class="sp-top bad">${spLogo()}<span class="mk">Стара пошта</span></div><div class="pg">
          <h1>Ваша посилка чекає</h1><p class="mk">Відправлення №${ri(20000000, 59999999)}0${ri(10, 99)} затримано на складі.</p>
          <p class="mk" data-ev="pay">Сплатіть доставку ${sum},00 грн, щоб отримати посилку сьогодні.</p>
          <form class="cardform" data-trap="card">
           <label class="fld"><span>Номер картки</span><input inputmode="numeric" autocomplete="off" placeholder="0000 0000 0000 0000"></label>
           <label class="fld"><span class="mk" data-ev="card">Термін дії та CVV-код</span><input autocomplete="off" placeholder="MM/РР   CVV"></label>
           <button class="go" style="background:#7a5a3a;color:#fff" type="submit">Сплатити ${sum} грн</button>
          </form></div></div>`;
        DOSSIER[host(dom)] = {created: pick(['вчора', '2 дні тому']), owner: 'приховано', note: `Домен ${dom.split('.').slice(1).join('.')} не належить Старій пошті.`};
        DOSSIER[dom.split('.').slice(1).join('.')] = DOSSIER[host(dom)];
      }
    });
  }

  /* 3. Школи закривають */
  {
    const head = pick(['ШКОЛИ ЗАКРИВАЮТЬ ДО БЕРЕЗНЯ!!!', 'УСІ ШКОЛИ ЗАКРИЮТЬ ДО ВЕСНИ!!!', 'ТЕРМІНОВО! ШКОЛИ НА КАРАНТИН ДО БЕРЕЗНЯ!']);
    const day = ri(3, 27), mon = pick(['лютого', 'березня', 'жовтня']);
    cases.push({
      app: 'msg', chat: 'Бабуся', title: 'Школи закривають', verdict: 'fake',
      brief: 'Бабуся переслала новину й питає, чи правда, що школи закривають до березня.',
      hint: 'Зверни увагу на дату новини й на те, хто «джерело». Пошукай, чи пишуть про це офіційні сайти.',
      ev: {
        caps: {label: 'Заголовок великими літерами і «!!!»', why: 'Крик у заголовку грає на емоціях. Серйозні медіа так не пишуть.'},
        anon: {label: 'Джерело без імені', why: '«Джерело в міністерстві» не можна перевірити. Справжня новина називає, хто це сказав.'},
        date: {label: `Новина минулого року (${day} ${mon} 2025)`, why: 'Стару новину пересилають як свіжу. Завжди дивись на дату.'},
        official3: {label: 'Міська рада: навчання за графіком', why: 'Офіційне джерело спростовує новину. Інші сайти лише передруковують Липову правду.'}
      },
      setup() {
        addChat('Бабуся', [
          {fwd: 'Переслано з «Липова правда»', t: `<b class="mk" data-ev="caps">${head}</b><br><span class="lnk mk" data-go="lypova-pravda.info/news/shkoly">lypova-pravda.info/news/shkoly</span>`, time: '18:20'},
          {t: '<span class="mk">Це правда??</span> Треба вже купувати путівку в село?', time: '18:21'}
        ]);
        setReplies('Бабуся', [
          {t: 'Бабусю, це фейк. Міська рада пише, що навчання за звичайним графіком', ans: 'Ох, а я вже сусідкам переслала 🙈 Зараз напишу їм. Дякую, онучку!'},
          {t: 'Не знаю, зараз перевірю', ans: 'Перевір, бо я хвилююся'},
          {t: 'Ура, канікули! 🎉', ans: 'Ти ж спершу перевір 🤨'}
        ]);
        PAGES['lypova-pravda.info/news/shkoly'] = PAGES['lypova-pravda.info'] = () => `<div class="sk-lp"><div class="lp-top mk">ЛИПОВА ПРАВДА</div><div class="lp-nav">Новини · Скандали · Сенсації · Гороскоп</div><div class="pg">
          <h1 class="mk" data-ev="caps">${head}</h1>
          <p class="meta"><span class="mk" data-ev="date">${day} ${mon} 2025</span> · <span class="mk">Редакція</span> · 18 452 перегляди</p>
          <p>Учні всієї країни підуть на довгі канікули аж до березня. <span class="mk" data-ev="anon">Про це нам повідомило джерело в міністерстві, яке побажало залишитися невідомим.</span></p>
          <p class="mk">Батькам радять уже зараз планувати відпочинок. Деталі — згодом.</p>
          <span class="share mk">Перешли всім, поки не видалили!</span></div></div>`;
        DOSSIER['lypova-pravda.info'] = {created: '4 місяці тому', owner: 'приховано', note: 'Сайт часто публікує сенсації без джерел.'};
        PAGES['lypove.gov.ua'] = PAGES['lypove.gov.ua/news'] = () => `<div class="gov-top">Липівська міська рада</div><div class="pg">
          <h1>Освіта: розклад канікул</h1><p class="meta">Оновлено цього тижня</p>
          <p class="mk" data-ev="official3">Навчання у школах триває за звичайним графіком. Зимові канікули — з 25 грудня до 11 січня.</p>

/* ---------- seeded random ---------- */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const nowT = () => new Date().toTimeString().slice(0, 5);

/* ---------- state ---------- */
const S = {seed: 0, cases: [], ci: 0, score: 0, results: [], found: new Set(), misses: 0, hint: false, traps: 0, active: false};
let marker = false;
function build() {
  rnd = mulberry(S.seed);
  closeAllWins();
  B.hist = []; B.pos = -1; curChat = null; curPhoto = null; dossierQ = ''; fxPath = 'Комп\'ютер'; NOTIFS.length = 0;
  S.cases = buildShift();
}
function newShift() {
  S.seed = Math.floor(Math.random() * 1e9); S.score = 0; S.results = [];
  build(); setMarker(false);
  beginCase(0);
}
function beginCase(i, silent) {
  S.ci = i; S.found = new Set(); S.misses = 0; S.hint = false; S.traps = 0;
  const c = S.cases[i];
  c.setup();
  S.active = true;
  renderAll(); save();
  if (!silent) notifyCase(c);
}
function save() { store.set('progress', {seed: S.seed, ci: S.ci, score: S.score, results: S.results, found: [...S.found], misses: S.misses, hint: S.hint, traps: S.traps}); }
function restore(p) {
  S.seed = p.seed; build();
  for (let i = 0; i < p.ci; i++) { S.ci = i; S.cases[i].setup(); }
  S.ci = p.ci; S.cases[p.ci].setup();
  Object.assign(S, {score: p.score, results: p.results || [], found: new Set(p.found || []), misses: p.misses || 0, hint: !!p.hint, traps: p.traps || 0, active: true});
  Object.values(CHATS).forEach(c => c.unread = 0); SMS.forEach(m => m.unread = 0); FEED.forEach(f => f.unread = 0);
  renderAll();
  if (S.results.length > S.ci) { S.active = false; if (S.ci < S.cases.length - 1) beginCase(S.ci + 1); else endShift(); }
}
function notifyCase(c) {
  setTimeout(() => {
    notify({app: 'case', title: 'Бюро перевірки фактів', text: `Нова справа ${S.ci + 1} з ${S.cases.length}: ${c.title}`});
    const ch = Object.values(CHATS).find(x => x.msgs.some(m => m.case === S.ci && !m.me));
    setTimeout(() => {
      if (c.app === 'sms') { const m = SMS[SMS.length - 1]; notify({app: 'sms', title: m.from, text: strip(m.t)}); }
      else if (ch) { const m = [...ch.msgs].reverse().find(m => m.case === S.ci && !m.me); notify({app: 'msg', chat: ch.name, title: ch.name, text: strip(m.t)}); }
      else if (c.app === 'feed') { const p = FEED[0]; notify({app: 'feed', title: 'Стрічка · ' + p.author, text: strip(p.text)}); }
    }, 1600);
  }, 700);
}

function resizify(el, h) {
  let sx, sy, ow, oh, id = null;
  h.addEventListener('pointerdown', e => {
    if (isMobile()) return;
    e.stopPropagation(); id = e.pointerId; h.setPointerCapture(id);
    sx = e.clientX; sy = e.clientY; ow = el.offsetWidth; oh = el.offsetHeight; el.classList.add('dragging');
    const w = wins[el.dataset.app]; if (w && w.prev) { w.prev = null; el.classList.remove('maxed'); }
  });
  h.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const d = $('#desk');
    el.style.width = Math.max(300, Math.min(d.clientWidth - el.offsetLeft, ow + e.clientX - sx)) + 'px';
    el.style.height = Math.max(220, Math.min(d.clientHeight - el.offsetTop, oh + e.clientY - sy)) + 'px';
  });
  const up = e => { if (e.pointerId === id) { id = null; el.classList.remove('dragging'); } };
  h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
}
function dragify(el, handle) {
  let sx, sy, ox, oy, id = null;
  handle.addEventListener('pointerdown', e => {
    if (isMobile() || e.target.closest('button')) return;
    if (el.classList.contains('maxed')) return;
    id = e.pointerId; handle.setPointerCapture(id);
    sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop; handle.style.cursor = 'grabbing'; el.classList.add('dragging');
  });
  handle.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const d = $('#desk');
    el.style.left = Math.max(-el.offsetWidth + 80, Math.min(d.clientWidth - 80, ox + e.clientX - sx)) + 'px';
    el.style.top = Math.max(0, Math.min(d.clientHeight - 44, oy + e.clientY - sy)) + 'px';
  });
  const up = e => { if (e.pointerId === id) { id = null; handle.style.cursor = ''; el.classList.remove('dragging'); } };
  handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
}

/* ---------- verdict ---------- */
function verdict(v) {
  const c = S.cases[S.ci];
  if (!S.found.size) { sfx.bad(); toast('Без доказів печатку не ставлять. Знайди хоча б один.'); return; }
  const ok = v === c.verdict;
  if (ok) S.score += 40;
  sfx.stamp();
  const ids = Object.keys(c.ev), total = 40 + ids.length * 15;
  const got = 15 * S.found.size + (ok ? 40 : 0) - 5 * S.misses - (S.hint ? 10 : 0) - 10 * S.traps;
  S.results.push({title: c.title, ok, found: S.found.size, all: ids.length, pts: Math.max(0, got), max: total});
  S.active = false; save();
  const col = {fake: 'var(--stamp)', true: 'var(--ok)', manip: '#a26a12'}[c.verdict];
  $('#repBody').innerHTML = `<h2>${ok ? 'Влучно!' : 'Майже…'}</h2>
    <div class="verdict"><span class="bigstamp" style="color:${col}">${VERD[c.verdict]}</span><p>${ok ? 'Твоя печатка правильна.' : `Ти поставив «${VERD[v]}», а насправді це <b>${VERD[c.verdict].toLowerCase()}</b>.`}</p></div>
    ${S.traps ? '<p class="hintt" style="margin-bottom:12px">Ти ввів дані на сайті шахраїв. У житті цього робити не можна: дані потрапили б до злодіїв.</p>' : ''}
    <div class="rl">${ids.map(k => `<div class="ri ${S.found.has(k) ? 'y' : 'n'}">${icon(S.found.has(k) ? 'i-check' : 'i-miss')}<span><b>${esc(c.ev[k].label)}</b>${esc(c.ev[k].why)}</span></div>`).join('')}</div>
    <p class="pts">За справу: ${Math.max(0, got)} з ${total} балів</p>
    <div class="dfoot"><button class="btn main" id="nextB" type="button">${icon('i-play')}${S.ci < S.cases.length - 1 ? 'Наступна справа' : 'Підсумок зміни'}</button></div>`;
  $('#repDlg').showModal();

}

  /* робочий стіл */

    ['Оновити', 'i-reload', () => { $('#icons').style.opacity = 0; setTimeout(() => { drawDesk(); renderBadges(); $('#icons').style.opacity = ''; }, 150); }],
    ['Змінити шпалери', 'i-photo', () => { wall = (wall + 1) % WALLS.length; store.set('wall', wall); applyWall(); }],
    '-',
    ['Комп\'ютер', 'i-pc', () => openWin('pc')],
    ['Підручник', 'i-book', () => openWin('guide')],
    ['Налаштування', 'i-ctl', () => openWin('settings')]
  ];
}
let CTX = [];
document.addEventListener('contextmenu', e => {
  if (!e.target.closest('#os') || e.target.closest('input')) return;
  if (INFECTED) { e.preventDefault(); return; }
  e.preventDefault();
  CTX = ctxItems(e.target);
  const m = $('#ctx');
  m.innerHTML = CTX.map((x, i) => x === '-' ? '<hr>' : `<button type="button" data-ctx="${i}">${icon(x[1])}${esc(x[0])}</button>`).join('');
  m.hidden = false;
  const W = m.offsetWidth, H = m.offsetHeight;
  m.style.left = Math.min(e.clientX, innerWidth - W - 6) + 'px';
  m.style.top = Math.min(e.clientY, innerHeight - H - 6) + 'px';
  tone(600, .03, 'triangle', .025);
});
function hideCtx() { $('#ctx').hidden = true; }
document.addEventListener('pointerdown', e => { if (!e.target.closest('#ctx')) hideCtx(); }, true);
window.addEventListener('blur', () => { hideCtx(); setTimeout(() => { const a = document.activeElement; if (a && a.classList.contains('gframe') && focused !== 'game') focusWin('game'); }, 0); });

/* ---------- infection (наслідок шахрайства) ---------- */
let INFECTED = false, spamT = [];
const ADS = [
  ['ВІТАЄМО!!!', 'Ти 1 000 000-й відвідувач! Забери свій приз 🎁', '#f6e19c', 'Забрати приз'],
  ['УВАГА! ВІРУСИ!', 'На твоєму ПК знайдено 67 вірусів. Натисни, щоб очистити!', '#ffb3ad', 'Очистити'],
  ['-99% ТІЛЬКИ СЬОГОДНІ', 'Робакси майже безкоштовно! Встигни за 30 секунд!', '#bfe3cf', 'Купити'],
  ['БЕЗКОШТОВНІ СКІНИ', 'Завантаж генератор скінів просто зараз', '#d5c7f1', 'Завантажити'],
  ['АКАУНТ ЗАБЛОКОВАНО', 'Сплати 999 грн, щоб розблокувати свій акаунт', '#ffb3ad', 'Сплатити'],
  ['ТИ ВИГРАВ СМАРТФОН', 'Введи номер картки, щоб оплатити доставку', '#bddcf3', 'Отримати'],
  ['ГАРЯЧІ ЗНИЖКИ', 'Купуй-купуй-купуй! Кількість обмежена!!!', '#f6c6a6', 'До кошика'],
  ['ПК ПЕРЕГРІВАЄТЬСЯ', 'Встанови «Супер Прискорювач 3000», поки не пізно', '#f6e19c', 'Встановити']
];
function spawnAd(x, y) {
  if (!INFECTED) return;
  const layer = $('#spam'), a = ADS[Math.floor(Math.random() * ADS.length)];
  const el = document.createElement('div'); el.className = 'ad';
  const W = Math.min(300, innerWidth - 20);
  el.style.left = (x ?? Math.random() * Math.max(10, innerWidth - W - 10)) + 'px';
  el.style.top = (y ?? Math.random() * Math.max(10, innerHeight - 260)) + 'px';
  el.style.setProperty('--ad', a[2]);
  el.style.transform = `rotate(${(Math.random() * 6 - 3).toFixed(1)}deg)`;
  el.innerHTML = `<div class="adt"><b>Реклама</b><button type="button" aria-label="Закрити">${icon('i-x')}</button></div><div class="adb"><h4>${a[0]}</h4><p>${a[1]}</p><span class="adbtn">${a[3]}</span></div>`;
  el.querySelector('button').onclick = ev => { ev.stopPropagation(); const r = el.getBoundingClientRect(); el.remove(); tone(300, .08, 'square', .04); spawnAd(r.left + 30, r.top + 30); spawnAd(r.left - 30, r.top + 50); };
  el.onclick = () => { tone(200, .1, 'square', .05); spawnAd(); };
  layer.appendChild(el);
  tone(300 + Math.random() * 600, .07, 'square', .035);
}
function infect(kind) {
  if (INFECTED) return;
  INFECTED = true; store.set('progress', null); S.active = false;
  setMarker(false); hideCtx();
  $$('dialog[open]').forEach(d => d.close());
  const c = S.cases[S.ci], who = c && c.chat ? c.chat : 'Друг';
  const NS = kind === 'card'
    ? [['sms', 'ПіксельБанк', 'Списано 2 499 грн. Покупка в інтернеті'], ['sms', 'ПіксельБанк', 'Списано 4 990 грн. Покупка в інтернеті'], ['sms', 'Невідомий номер', 'Ваша картка заблокована. Перейдіть за посиланням…'], ['sms', 'ПіксельБанк', 'Недостатньо коштів на рахунку']]
    : [['msg', 'Roblox', 'Пароль змінено з нового пристрою'], ['msg', who, 'чого ти мені шлеш якісь дивні посилання??'], ['msg', 'Клас 7-Б', 'хто це пише з твого акаунта?? 😳'], ['msg', 'Roblox', 'Усі робакси з акаунта витрачено']];
  NS.push(['case', 'Система', 'Знайдено підозрілу програму'], ['msg', 'Невідомий', 'Привіт! Хочеш ще безкоштовних подарунків? 🎁']);
  $('#os').classList.add('sick');
  $('#spam').hidden = false;
  let n = 0;
  spamT.push(setInterval(() => spawnAd(), 320));
  spamT.push(setInterval(() => { const x = NS[n++ % NS.length]; notify({app: x[0], title: x[1], text: x[2]}); }, 750));
  spamT.push(setTimeout(() => {
    spamT.forEach(t => { clearInterval(t); clearTimeout(t); });
    $('#crashTxt').textContent = kind === 'card'
      ? 'Ти ввів дані картки на сайті шахраїв. З картки списують гроші, а комп\'ютер заповнили віруси й реклама.'
      : 'Ти ввів пароль на сайті шахраїв. Твій акаунт викрали, від твого імені розсилають спам, а комп\'ютер заповнили віруси й реклама.';
    $('#crash').hidden = false; sfx.bad();
  }, 5800));
}
function reboot() {
  $('#crash').hidden = true; $('#spam').innerHTML = ''; $('#spam').hidden = true; $('#os').classList.remove('sick');
  $('#notifs').innerHTML = '';
  INFECTED = false;
  const b = $('#boot'); b.hidden = false; b.classList.remove('hide');
  setTimeout(() => {
    b.classList.add('hide'); setTimeout(() => b.hidden = true, 400);
    newShift();
    setTimeout(() => notify({app: 'guide', title: 'Комп\'ютер перезапущено', text: 'Зміну розпочато заново. Пам\'ятай: пароль і дані картки не вводять за посиланнями з повідомлень.'}), 300);
  }, 1300);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (marker && t.closest('#os .wb') && !t.closest('.casep')) {
    const mk = t.closest('.mk');
    if (!t.closest('input,button:not(.mk),form .go')) {
      e.preventDefault(); e.stopPropagation();
      if (mk) tryMark(mk); else { sfx.bad(); toast('Натискай на текст чи деталь, яку вважаєш доказом.'); }
      return;
    }
  }
  if (!t.closest('#startm,#startBtn')) { $('#startm').hidden = true; $('#startBtn').classList.remove('on'); }
  if (!t.closest('#ncenter,#trBell')) $('#ncenter').hidden = true;
  const cx = t.closest('[data-ctx]'); if (cx) { const x = CTX[+cx.dataset.ctx]; hideCtx(); sfx.click(); x[2](); return; }
  if (INFECTED) return;
  const tbb = t.closest('[data-tb]'); if (tbb) { tbClick(tbb.dataset.tb); return; }
  const o = t.closest('[data-open]'); if (o) { if (o.dataset.path) { fxPath = o.dataset.path; } openWin(o.dataset.open); if (o.dataset.path) renderPc(); return; }
  const g = t.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const chEl = t.closest('[data-chat]'); if (chEl) { curChat = chEl.dataset.chat || null; renderMsg(); return; }
  const tb = t.closest('[data-tab]'); if (tb) { toolTab = tb.dataset.tab; renderTools(); return; }
  const pp = t.closest('[data-pickph]'); if (pp) { curPhoto = pp.dataset.pickph; renderTools(); return; }
  const cp = t.closest('.chkph'); if (cp) { curPhoto = cp.dataset.photo; if (toolTab === 'dossier') toolTab = 'reverse'; openWin('tools'); renderTools(); return; }
  const nv = t.closest('[data-nav]'); if (nv) { const a = nv.dataset.nav; if (a === 'back' && B.pos > 0) B.pos--; if (a === 'fwd' && B.pos < B.hist.length - 1) B.pos++; showPage(); return; }
  const fx = t.closest('[data-fx]'); if (fx) { fxPath = fx.dataset.fx; renderPc(); return; }
  const fi = t.closest('[data-fi]'); if (fi) { openFile(wins.pc.items[+fi.dataset.fi]); return; }
  const gb = t.closest('[data-gi]'); if (gb) { gi = +gb.dataset.gi; renderGuide(); return; }
  const ni = t.closest('[data-ni]'); if (ni) { openNotif(NOTIFS[+ni.dataset.ni]); return; }
  const rb = t.closest('[data-rep]'); if (rb) { sendReply(+rb.dataset.rep); return; }
  const st = t.closest('.st'); if (st) { verdict(st.dataset.v); return; }
  if (t.closest('#hintB')) { S.hint = true; S.score = Math.max(0, S.score - 10); renderCase(); save(); return; }
  if (t.closest('#binClear')) { FS['Кошик'] = []; sfx.click(); toast('Кошик очищено'); renderPc(); return; }
  if (t.closest('#newShiftB') || t.closest('#newShiftC')) { newShift(); return; }
  const sb = t.closest('#sndSeg button'); if (sb) { setSound(sb.dataset.v === '1'); sfx.click(); return; }
  if (t.closest('[data-close]')) { t.closest('dialog').close(); return; }
}, true);
const mo = new MutationObserver(() => { mo.disconnect(); restoreFound(); mo.observe($('#desk'), {childList: true, subtree: true}); });
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'urlF') { go($('#urlIn').value); return; }
  if (f.id === 'sF') { const q = $('#sIn').value; if (q.trim()) go('poshuk.web/?q=' + encodeURIComponent(q.trim())); return; }
  if (f.id === 'dF') { dossierQ = $('#dIn').value.trim(); renderTools(); return; }
  if (f.dataset.trap) { infect(f.dataset.trap); return; }
});
document.addEventListener('keydown', e => {
  if (INFECTED) { hideCtx(); return; }
  if (e.key === 'Escape') hideCtx();
  if (e.target.matches('input') || document.querySelector('dialog[open]')) return;
  if (e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') { setMarker(!marker); }
  if (e.key === 'Escape') {
    if (!$('#startm').hidden || !$('#ncenter').hidden) { $('#startm').hidden = true; $('#ncenter').hidden = true; $('#startBtn').classList.remove('on'); }
    else if (marker) setMarker(false); else if (focused && wins[focused]) closeWin(focused);
  }
});
$('#rebootB').onclick = reboot;
$('#trMk').onclick = () => { setMarker(!marker); sfx.click(); toast(marker ? 'Маркер увімкнено: натискай на докази.' : 'Маркер вимкнено.'); };
$('#trSnd').onclick = () => setSound(!sound);
$('#trBell').onclick = () => { const n = $('#ncenter'); n.hidden = !n.hidden; $('#startm').hidden = true; renderBell(); };
$('#tbCase').onclick = () => tbClick('case');
$('#startBtn').onclick = () => { const m = $('#startm'); m.hidden = !m.hidden; $('#startBtn').classList.toggle('on', !m.hidden); $('#smBest').textContent = store.get('best', 0) ? 'Рекорд: ' + store.get('best', 0) : ''; sfx.click(); };
$('#nClear').onclick = () => { NOTIFS.length = 0; renderBell(); };
$('#powerBtn').onclick = () => { $('#startm').hidden = true; $('#off').hidden = false; closeAllWins(); setMarker(false); renderTaskbar(); };
$('#powerOn').onclick = () => { $('#off').hidden = true; boot(); };
$('#repDlg').addEventListener('cancel', e => e.preventDefault());
$('#endDlg').addEventListener('cancel', e => e.preventDefault());
const tick = () => { $('#clock').textContent = nowT(); };
setInterval(tick, 1000); tick();
window.addEventListener('resize', () => { if (wins[focused]) focusWin(focused); });

function boot() {
  const b = $('#boot'); b.hidden = false; b.classList.remove('hide');
  const fast = matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTimeout(() => {
    b.classList.add('hide'); setTimeout(() => b.hidden = true, 400);
    const p = store.get('progress', null);
    if (p && p.seed) {
      restore(p);
      setTimeout(() => notify({app: 'case', title: 'З поверненням!', text: `Продовжуємо справу ${S.ci + 1}: ${S.cases[S.ci].title}`}), 600);
    } else {
      S.seed = Math.floor(Math.random() * 1e9); S.score = 0; S.results = [];
      build();
      setTimeout(() => notify({app: 'guide', title: 'Вітаємо, стажере!', text: 'Ти в Бюро перевірки фактів. Почни з Підручника на робочому столі.'}), 500);
      setTimeout(() => beginCase(0), 2200);
    }
  }, fast ? 100 : 1100);
}
drawDesk(); setSound(sound); renderBell(); applyWall();
mo.observe($('#desk'), {childList: true, subtree: true});
boot();
</script>
